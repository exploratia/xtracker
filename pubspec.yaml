name: xtracker
description: "generic tracker app"
repository: https://github.com/exploratia/xtracker
homepage: https://exploratia.de/xtracker.php

funding:
  - https://buymeacoffee.com/exploratia

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 2.2.0+16

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  #  flutter_localizations:
  #    sdk: flutter
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.9

  # EasyLocalization
  easy_localization: ^3.0.8

  # DeviceStorage
  flutter_secure_storage: ^11.0.0

  # AppInfo
  package_info_plus: ^10.1.0

  # DeviceInfo
  device_info_plus: ^13.1.0

  # SimpleLogging
  # determine paths like tmp or app data
  path_provider: ^2.1.5
  # zip files
  archive: ^4.0.9
  logger: ^2.7.0

  # call native share dialog
  share_plus: ^13.1.0

  # color picker
  flutter_colorpicker: ^1.1.0

  # month picker
  month_picker_dialog: ^6.7.2

  # UUID generation (ids for model)
  uuid: ^4.5.3

  # provider
  provider: ^6.1.5+1

  # 2d grid
  linked_scroll_controller: ^0.2.0

  # chart
  fl_chart: ^1.2.0

  # data storage
  sembast: ^3.8.7
  sembast_web: ^2.4.4+1

  # file picker
  file_picker: ^12.0.0

  # url launcher
  url_launcher: ^6.3.2

  #quick actions (long press on app icon)
  quick_actions: ^1.1.0

  # notifications
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # Dropbox auto backup (Android/iOS only)
  dropbox_client: ^1.2.2

  # display HTML in flutter
  simple_html_css: ^5.0.0

  # csv
  csv: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # build assets
  flutter_gen_runner: any
  build_runner: any

  # splash
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - assets/images/bmc/
    - assets/images/google/
    - assets/images/paypal/
    - assets/images/logos/
    - assets/images/trend/
    - assets/translations/
    - assets/infos/

# asset constants generation
flutter_gen:
  line_length: 160
  output: lib/generated/
  #    package_parameter_enabled: true
  assets:
    exclude:
      - assets/translations/**

flutter_native_splash:
  android: true
  ios: false

  color: "#06041f"
  image: assets/images/logos/app_logo.png
  android_12:
    color: "#06041f"
    color_dark: "#06041f"
    icon_background_color: "#06041f"
    image: resources/android12splash.png
